<header class="header" [class.scrolled]="scrolled()">
  <nav class="nav-container">
    <a routerLink="/home" class="logo" aria-label="Gilberto Ayala — Home">
      <span class="logo-text" aria-hidden="true">Gilberto Ayala</span>
    </a>

    <ul class="nav-links desktop-nav" role="list">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            #navLink
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/home' }"
            class="nav-link">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <button
      type="button"
      mat-icon-button
      class="mobile-menu-button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="mobile-nav-menu"
      [attr.aria-label]="mobileMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'">
      <mat-icon aria-hidden="true">{{ mobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
  </nav>

  @if (mobileMenuOpen()) {
    <div class="mobile-nav" (click)="closeMobileMenu()">
      <nav
        id="mobile-nav-menu"
        class="mobile-nav-content"
        aria-label="Mobile navigation"
        (click)="$event.stopPropagation()">
        <ul class="mobile-nav-links" role="list">
          @for (link of navLinks; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: link.path === '/home' }"
                class="mobile-nav-link"
                (click)="closeMobileMenu()">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  }
</header>
